[package]
name = "topline"
description = "Topline: notch hidup untuk Windows 11"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "topline"
path = "src/main.rs"

[dependencies]
topline-core.workspace = true
topline-store.workspace = true
windows-core.workspace = true

[dependencies.windows]
