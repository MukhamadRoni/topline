[workspace]
resolver = "2"
members = ["crates/topline-core", "crates/topline-lyrics", "crates/topline-store", "apps/topline", "apps/topline-setup"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.58"
windows-core = "0.58"
topline-core = { path = "crates/topline-core" }
topline-store = { path = "crates/topline-store" }
topline-lyrics = { path = "crates/topline-lyrics" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
